<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNGSHOT - Tebak Lagu Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #09090e url('bg-pixel.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-card {
            background: rgba(18, 18, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.2);
        }
        .soundwave-bar { animation: soundwave 1.2s ease-in-out infinite alternate; }
        .soundwave-bar:nth-child(2n) { animation-delay: 0.2s; }
        .soundwave-bar:nth-child(3n) { animation-delay: 0.4s; }
        .soundwave-bar:nth-child(4n) { animation-delay: 0.6s; }
        @keyframes soundwave { 0% { height: 8px; } 100% { height: 48px; } }
        .soundwave-paused .soundwave-bar { animation-play-state: paused !important; height: 6px !important; }
    </style>
</head>
<body class="text-white flex items-center justify-center p-4 min-h-screen">

    <div id="game-container" class="w-full max-w-lg glass-card rounded-3xl p-6 relative overflow-hidden transition-all duration-300">
        
        <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-6">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-compact-disc text-pink-500 text-2xl animate-spin" style="animation-duration: 4s;"></i>
                <span class="font-orbitron font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400 text-lg tracking-wider">LNGSHOT</span>
            </div>
            
            <div class="flex items-center gap-3 font-orbitron text-sm">
                <div id="combo-badge" class="hidden bg-gradient-to-r from-amber-500 to-red-500 px-2.5 py-1 rounded-full text-xs font-bold animate-bounce shadow-lg">
                    <i class="fa-solid fa-fire mr-1"></i><span id="combo-count">2</span>x POIN
                </div>
                <div class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-gray-300">
                    <i class="fa-solid fa-trophy text-amber-400 mr-1"></i><span id="high-score-display">0</span>
                </div>
                <div class="bg-pink-500/20 border border-pink-500/40 px-3 py-1 rounded-full text-pink-300 font-bold">
                    <span id="score-display">0</span>
                </div>
            </div>
        </div>

        <!-- START SCREEN -->
        <div id="start-screen" class="text-center py-8 space-y-6">
            <div class="w-28 h-28 mx-auto rounded-full bg-gradient-to-tr from-pink-500 via-purple-600 to-cyan-400 p-1">
                <div class="w-full h-full bg-gray-950 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-music text-4xl text-pink-400"></i>
                </div>
            </div>

            <div>
                <h1 class="text-3xl font-extrabold font-orbitron tracking-wide text-white mb-2">TEBAK LAGU LNGSHOT</h1>
                <p class="text-gray-400 text-sm max-w-xs mx-auto">Uji seberapa Shotties kamu!</p>
            </div>

            <div class="bg-white/5 rounded-2xl p-4 text-left border border-white/10 text-xs space-y-2 text-gray-300">
                <div class="flex items-center gap-2"><i class="fa-solid fa-stopwatch text-pink-400 text-sm w-5"></i><span><strong>15 Detik</strong> per soal untuk menebak.</span></div>
                <div class="flex items-center gap-2"><i class="fa-solid fa-bolt text-amber-400 text-sm w-5"></i><span>Jawab cepat untuk bonus poin & combo!</span></div>
            </div>

            <button onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-pink-500 via-purple-600 to-cyan-500 rounded-2xl font-orbitron font-bold text-base tracking-wider shadow-lg shadow-pink-500/25">
                GAME START <i class="fa-solid fa-play ml-2"></i>
            </button>
        </div>

        <!-- GAMEPLAY SCREEN -->
        <div id="game-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center text-xs font-orbitron text-gray-400">
                <span>SOAL <span id="current-question-num" class="text-pink-400 font-bold">1</span> / <span id="total-questions-num">15</span></span>
                <span class="bg-purple-500/20 text-purple-300 px-2.5 py-0.5 rounded-full border border-purple-500/30">LNGSHOT TRACKS</span>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between items-center text-xs text-gray-400 font-orbitron">
                    <span><i class="fa-solid fa-clock text-pink-400 mr-1"></i> SISA WAKTU</span>
                    <span id="timer-text" class="font-bold text-pink-400">15.0s</span>
                </div>
                <div class="w-full bg-white/10 h-3 rounded-full overflow-hidden p-0.5 border border-white/10">
                    <div id="timer-bar" class="h-full bg-gradient-to-r from-pink-500 to-purple-500 rounded-full w-full"></div>
                </div>
            </div>

            <div class="bg-gradient-to-b from-white/10 to-white/5 border border-white/15 rounded-2xl p-5 text-center relative">
                <div class="relative w-24 h-24 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-pink-500/30 to-purple-600/30 border border-white/20 flex items-center justify-center">
                    <i class="fa-solid fa-record-vinyl text-5xl text-pink-400 animate-spin" style="animation-duration: 8s;" id="vinyl-icon"></i>
                </div>

                <div id="soundwave-container" class="flex items-center justify-center gap-1.5 h-12 my-2">
                    <div class="soundwave-bar w-1.5 bg-pink-500 rounded-full"></div>
                    <div class="soundwave-bar w-1.5 bg-purple-500 rounded-full"></div>
                    <div class="soundwave-bar w-1.5 bg-cyan-400 rounded-full"></div>
                    <div class="soundwave-bar w-1.5 bg-pink-400 rounded-full"></div>
                    <div class="soundwave-bar w-1.5 bg-purple-400 rounded-full"></div>
                </div>

                <p class="text-sm font-semibold text-gray-300 mt-2">jangan ngaku shotties kalo ga bisa jawab!</p>
            </div>

            <div id="options-grid" class="grid grid-cols-1 gap-3"></div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="hidden text-center py-6 space-y-6">
            <div class="inline-block p-4 rounded-full bg-pink-500/10 border border-pink-500/30 text-pink-400">
                <i class="fa-solid fa-award text-5xl"></i>
            </div>

            <div>
                <h2 class="text-2xl font-bold font-orbitron text-white">GAME SELESAI!</h2>
                <p id="result-evaluation" class="text-sm text-gray-400 mt-1">💯 buat shotties kita!</p>
            </div>

            <div class="grid grid-cols-2 gap-3 text-left">
                <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
                    <p class="text-xs text-gray-400 font-orbitron">SKOR AKHIR</p>
                    <p id="final-score" class="text-2xl font-black font-orbitron text-pink-400 mt-1">0</p>
                </div>
                <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
                    <p class="text-xs text-gray-400 font-orbitron">AKURASI</p>
                    <p id="final-accuracy" class="text-2xl font-black font-orbitron text-cyan-400 mt-1">0%</p>
                </div>
            </div>

            <button onclick="startGame()" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl font-orbitron font-bold text-sm tracking-wider">
                MAIN LAGI <i class="fa-solid fa-rotate-right ml-1"></i>
            </button>
        </div>

    </div>

    <audio id="audio-player" preload="auto"></audio>

    <script>
        const songDatabase = [
            { src: "lagu1.mp3", options: ["saucin", "thinking", "all good"], correct: 0 },
            { src: "lagu2.mp3", options: ["vanilla days", "ejeh", "never let go"], correct: 2 },
            { src: "lagu3.mp3", options: ["moonwalkin'", "facetime", "boo thang"], correct: 0 },
            { src: "lagu4.mp3", options: ["backseat", "moya", "summer eyes"], correct: 1 },
            { src: "lagu5.mp3", options: ["vanilla days", "my side", "good girls"], correct: 0 },
            { src: "lagu6.mp3", options: ["thinking", "now us", "ejeh"], correct: 2 },
            { src: "lagu7.mp3", options: ["fire with fire", "facetime", "trust myself"], correct: 0 },
            { src: "lagu8.mp3", options: ["good girls", "boo thang", "my side"], correct: 2 },
            { src: "lagu9.mp3", options: ["summer eyes", "for us", "are you ready"], correct: 0 },
            { src: "lagu10.mp3", options: ["boo thang", "good girls", "my side"], correct: 1 },
            { src: "lagu11.mp3", options: ["gukbbong", "4sho 4sho", "yeah yeah"], correct: 0 },
            { src: "lagu12.mp3", options: ["no hi no hey", "thinking", "trust myself"], correct: 1 },
            { src: "lagu13.mp3", options: ["next u2", "backseat", "run it up"], correct: 2 },
            { src: "lagu14.mp3", options: ["4sho 4sho", "are you ready", "yeah yeah"], correct: 0 },
            { src: "lagu15.mp3", options: ["gukbbong", "are you ready", "yeah yeah"], correct: 2 }
        ];

        let currentQuestionIndex = 0, score = 0, highScore = localStorage.getItem('lngshot_highscore') || 0, combo = 0, correctAnswersCount = 0;
        const TIMER_DURATION = 15;
        let timeRemaining = TIMER_DURATION, timerInterval = null, isAnswered = false;
        let audioCtx = null;
        const audioElement = document.getElementById('audio-player');

        document.getElementById('high-score-display').textContent = highScore;

        function playSFX(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        function playAudioSnippet() {
            audioElement.pause();
            audioElement.currentTime = 0;
            const currentSong = songDatabase[currentQuestionIndex];
            audioElement.src = currentSong.src;
            audioElement.play().catch(e => console.log(e));
            document.getElementById('soundwave-container').classList.remove('soundwave-paused');
            document.getElementById('vinyl-icon').classList.add('animate-spin');
        }

        function stopAudioSnippet() {
            audioElement.pause();
            document.getElementById('soundwave-container').classList.add('soundwave-paused');
            document.getElementById('vinyl-icon').classList.remove('animate-spin');
        }

        function startGame() {
            score = 0; combo = 0; correctAnswersCount = 0; currentQuestionIndex = 0;
            document.getElementById('score-display').textContent = '0';
            document.getElementById('combo-badge').classList.add('hidden');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('total-questions-num').textContent = songDatabase.length;
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false; timeRemaining = TIMER_DURATION;
            const question = songDatabase[currentQuestionIndex];
            document.getElementById('current-question-num').textContent = currentQuestionIndex + 1;
            
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            question.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full py-3.5 px-4 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-left font-semibold text-sm transition-all duration-200 flex items-center justify-between group`;
                btn.onclick = () => checkAnswer(index, btn);
                btn.innerHTML = `<span class="flex items-center gap-3"><span class="w-7 h-7 rounded-lg bg-white/10 flex items-center justify-center font-orbitron text-xs">${String.fromCharCode(65 + index)}</span><span>${optText}</span></span>`;
                optionsGrid.appendChild(btn);
            });

            playAudioSnippet();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining -= 0.1;
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    clearInterval(timerInterval);
                    checkAnswer(-1, null);
                }
                document.getElementById('timer-text').textContent = timeRemaining.toFixed(1) + 's';
                document.getElementById('timer-bar').style.width = ((timeRemaining / TIMER_DURATION) * 100) + '%';
            }, 100);
        }

        function checkAnswer(selectedIndex, clickedBtn) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);
            stopAudioSnippet();

            const question = songDatabase[currentQuestionIndex];
            const isCorrect = selectedIndex === question.correct;
            const allButtons = document.getElementById('options-grid').querySelectorAll('button');

            allButtons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                playSFX('correct');
                correctAnswersCount++;
                combo++;
                score += 100 + Math.round(timeRemaining * 5);
                document.getElementById('score-display').textContent = score;

                if (combo > 1) {
                    document.getElementById('combo-count').textContent = combo;
                    document.getElementById('combo-badge').classList.remove('hidden');
                }

                clickedBtn.className = "w-full py-3.5 px-4 rounded-xl bg-emerald-500/80 border-2 border-emerald-400 text-white font-semibold text-sm flex items-center justify-between";
                confetti({ particleCount: 25, spread: 60, origin: { y: 0.7 } });
            } else {
                playSFX('wrong');
                combo = 0;
                document.getElementById('combo-badge').classList.add('hidden');
                if (clickedBtn) clickedBtn.className = "w-full py-3.5 px-4 rounded-xl bg-red-600/80 border-2 border-red-400 text-white font-semibold text-sm flex items-center justify-between";
                const correctBtn = allButtons[question.correct];
                if (correctBtn) correctBtn.className = "w-full py-3.5 px-4 rounded-xl bg-emerald-500/30 border-2 border-emerald-400 text-emerald-200 font-semibold text-sm flex items-center justify-between";
                
                showWoojinMeme();
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < songDatabase.length) loadQuestion();
                else endGame();
            }, 1800);
        }

        function showWoojinMeme() {
            const popup = document.createElement('div');
            popup.className = "fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm";
            popup.innerHTML = `
                <div class="bg-gray-900 border border-white/20 p-4 rounded-2xl max-w-xs text-center space-y-3 shadow-2xl">
                    <img src="woojin-meme.jpg" alt="Woojin Meme" class="w-48 h-48 mx-auto rounded-xl object-cover border border-red-500/50">
                    <p class="font-orbitron font-bold text-red-400 text-sm">WAAH SALAH! 😭</p>
                </div>
            `;
            document.body.appendChild(popup);
            setTimeout(() => { popup.remove(); }, 1200);
        }

        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('lngshot_highscore', highScore);
                document.getElementById('high-score-display').textContent = highScore;
                confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
            }

            document.getElementById('final-score').textContent = score;
            document.getElementById('final-accuracy').textContent = Math.round((correctAnswersCount / songDatabase.length) * 100) + '%';
        }
    </script>
</body>
    </html>
