<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Shotties World - Guess the Song!</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        
        body {
            background-color: #0d0f12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .game-card {
            background: rgba(20, 22, 29, 0.95);
            border: 3px solid #ff0055;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(ff, 0, 85, 0.3);
            position: relative;
            text-align: center;
        }

        /* LANDING PAGE STYLE */
        #landingPage {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), url('bg-pixel.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            padding: 40px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 380px;
            border: 2px solid #00ffcc;
        }

        .title-text {
            font-size: 22px;
            color: #00ffcc;
            text-shadow: 3px 3px #ff0055;
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.3;
        }

        .btn-start {
            background: #ff0055;
            color: #fff;
            border: 2px solid #fff;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.5);
            transition: 0.2s;
            font-family: inherit;
        }

        .btn-start:hover {
            transform: scale(1.05);
            background: #00ffcc;
            color: #000;
            border-color: #000;
        }

        /* GAMEPLAY STYLE */
        #gamePage { display: none; }

        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .lives { color: #ff0055; font-size: 16px; }
        .score { color: #00ffcc; font-weight: bold; }

        .audio-box {
            background: #1a1d26;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .btn-audio {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-choice {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #333;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            text-transform: capitalize;
        }

        .btn-choice:hover {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
        }

        /* WOONIN MEME POP-UP */
        #memeOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 18px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }

        #memeOverlay img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #ff0055;
            margin-bottom: 12px;
            animation: pop 0.3s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        .meme-text {
            color: #ff0055;
            font-weight: bold;
            font-size: 18px;
        }

        /* END SCREEN */
        #endPage {
            display: none;
            padding: 20px 0;
        }

        .end-title {
            font-size: 20px;
            color: #00ffcc;
            margin-bottom: 15px;
        }

        .final-score {
            font-size: 32px;
            color: #ff0055;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-card">
    
    <!-- LANDING PAGE -->
    <div id="landingPage">
        <div class="title-text">Welcome to<br>Shotties World</div>
        <button class="btn-start" onclick="startGame()">MULAI GAME 🎵</button>
    </div>

    <!-- GAMEPLAY PAGE -->
    <div id="gamePage">
        <div class="header-status">
            <span class="lives" id="livesDisplay">❤️❤️❤️❤️❤️</span>
            <span id="questionNum">SOAL 1/15</span>
            <span class="score" id="scoreDisplay">POIN: 0</span>
        </div>

        <div class="audio-box">
            <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Dengerin potongan lagunya:</p>
            <button class="btn-audio" onclick="playAudio()">▶️ PUTAR LAGU</button>
            <audio id="audioPlayer"></audio>
        </div>

        <div class="choices-container" id="choicesBox"></div>
    </div>

    <!-- OVERLAY MEME WOOJIN -->
    <div id="memeOverlay">
        <img src="woojin-meme.jpg" alt="Meme Woojin">
        <div class="meme-text">SALAH ZONK! 😜</div>
        <p style="font-size: 11px; color: #aaa; margin-top: 5px;">Nyawa berkurang 1...</p>
    </div>

    <!-- END PAGE -->
    <div id="endPage">
        <div class="end-title" id="endTitle">GAME OVER</div>
        <div class="final-score" id="finalScore">0 POIN</div>
        <button class="btn-start" onclick="location.reload()">🔄 MAIN LAGI</button>
    </div>

</div>

<script>
    // Data 15 Soal
    const questions = [
        { audio: "lagu1.mp3", ans: "saucin", opts: ["saucin", "thinking", "all good"] },
        { audio: "lagu2.mp3", ans: "never let go", opts: ["vanilla days", "ejeh", "never let go"] },
        { audio: "lagu3.mp3", ans: "moonwalkin'", opts: ["moonwalkin'", "facetime", "boo thang"] },
        { audio: "lagu4.mp3", ans: "moya", opts: ["backseat", "moya", "summer eyes"] },
        { audio: "lagu5.mp3", ans: "vanilla days", opts: ["vanilla days", "my side", "good girls"] },
        { audio: "lagu6.mp3", ans: "ejeh", opts: ["thinking", "now us", "ejeh"] },
        { audio: "lagu7.mp3", ans: "fire with fire", opts: ["fire with fire", "facetime", "trust myself"] },
        { audio: "lagu8.mp3", ans: "my side", opts: ["good girls", "boo thang", "my side"] },
        { audio: "lagu9.mp3", ans: "summer eyes", opts: ["summer eyes", "for us", "are you ready"] },
        { audio: "lagu10.mp3", ans: "good girls", opts: ["boo thang", "good girls", "my side"] },
        { audio: "lagu11.mp3", ans: "gukbbong", opts: ["gukbbong", "4sho 4sho", "yeah yeah"] },
        { audio: "lagu12.mp3", ans: "thinking", opts: ["no hi no hey", "thinking", "trust myself"] },
        { audio: "lagu13.mp3", ans: "run it up", opts: ["next u2", "backseat", "run it up"] },
        { audio: "lagu14.mp3", ans: "4sho 4sho", opts: ["4sho 4sho", "are you ready", "yeah yeah"] },
        { audio: "lagu15.mp3", ans: "yeah yeah", opts: ["gukkbong", "are you ready", "yeah yeah"] }
    ];

    let currentIdx = 0;
    let lives = 5;
    let score = 0;

    const audioPlayer = document.getElementById("audioPlayer");

    // Audio efek cheer pas bener (pake Web Audio API biar gratisan tanpa file)
    function playCheerSound() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
    }

    function startGame() {
        document.getElementById("landingPage").style.display = "none";
        document.getElementById("gamePage").style.display = "block";
        loadQuestion();
    }

    function playAudio() {
        audioPlayer.play();
    }

    function loadQuestion() {
        if (currentIdx >= questions.length) {
            endGame(true);
            return;
        }

        const q = questions[currentIdx];
        document.getElementById("questionNum").innerText = `SOAL ${currentIdx + 1}/15`;
        audioPlayer.src = q.audio;

        const box = document.getElementById("choicesBox");
        box.innerHTML = "";

        q.opts.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "btn-choice";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            box.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        audioPlayer.pause();
        const q = questions[currentIdx];

        if (selected === q.ans) {
            // JAWABAN BENAR
            score += 10;
            document.getElementById("scoreDisplay").innerText = `POIN: ${score}`;
            playCheerSound();
            confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });

            currentIdx++;
            setTimeout(loadQuestion, 800);
        } else {
            // JAWABAN SALAH
            lives--;
            updateLives();

            // TAMPILKAN MEME WOOJIN
            const overlay = document.getElementById("memeOverlay");
            overlay.style.display = "flex";

            setTimeout(() => {
                overlay.style.display = "none";
                if (lives <= 0) {
                    endGame(false);
                } else {
                    currentIdx++;
                    loadQuestion();
                }
            }, 1500);
        }
    }

    function updateLives() {
        let hearts = "";
        for (let i = 0; i < lives; i++) hearts += "❤️";
        document.getElementById("livesDisplay").innerText = hearts || "💀";
    }

    function endGame(isWin) {
        document.getElementById("gamePage").style.display = "none";
        document.getElementById("endPage").style.display = "block";

        if (isWin) {
            document.getElementById("endTitle").innerText = "🎉 SELAMAT! TAMAT!";
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
        } else {
            document.getElementById("endTitle").innerText = "💀 GAME OVER!";
        }

        document.getElementById("finalScore").innerText = `TOTAL POIN: ${score}`;
    }
</script>

</body>
  </html>
